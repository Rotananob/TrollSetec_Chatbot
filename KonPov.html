            function limitEmojis(str) {
                const emojiRegex = /([\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}\u{1F018}-\u{1F270}\u{238C}-\u{2454}\u{20D0}-\u{20FF}])/gu;
                let emojis = str.match(emojiRegex);
                if (emojis && emojis.length > 3) {
                    let count = 0;
                    str = str.replace(emojiRegex, m => (++count <= 3 ? m : ''));
                }
                return str;
            }
            userBubble.innerHTML = limitEmojis(text);

                const history = getKonpovHistory();

        // Chat History Modal logic
        function showKonpovHistoryModal() {

                modalContent.innerHTML = '<div class="text-slate-400 text-center py-8">មិនទាន់មានប្រវត្តិជជែកទេ</div>';

                const sessionMessagesDiv = modalContent.querySelector('#session-messages');
                // Show latest session at the top
                const reversedSessions = [...sessions].reverse();
                let showAll = false;
                function renderSessionRows() {
                    sessionListDiv.innerHTML = '';
                    let displaySessions = reversedSessions;
                    if (!showAll && reversedSessions.length > 4) {
                        displaySessions = reversedSessions.slice(0, 4);
                    }
                    displaySessions.forEach((session, idx) => {
                        const sessionRow = document.createElement('div');
                        sessionRow.className = 'flex items-center group';

                        sessionBtn.className = 'flex-1 text-left px-4 py-2 mb-1 rounded bg-slate-800 hover:bg-yellow-500/20 font-bold text-yellow-300 transition';

                            label += ` <span class='text-xs text-slate-400 font-normal'>(${d.toLocaleString()})</span>`;
                        }
                        sessionBtn.innerHTML = label;
                        sessionBtn.onclick = () => {
                            // Show messages for this session
                            sessionMessagesDiv.innerHTML = '';
                            if (!session.messages || !session.messages.length) {
                                sessionMessagesDiv.innerHTML = '<div class="text-slate-400 text-center py-8">មិនទាន់មានប្រវត្តិជជែកទេ</div>';
                            } else {
                                session.messages.forEach(msg => {
                                    if (msg.role === 'user') {
                                        sessionMessagesDiv.innerHTML += `
                                            <div class='flex flex-col items-end gap-1 my-2'>
                                                <div class='flex items-center gap-2 mb-0.5'>
                                                    <span class='font-bold text-blue-500 text-xs'>${msg.userNameStr || 'User'}</span>
                                                    <img src='${msg.userAvatar || 'https://api.dicebear.com/7.x/adventurer/svg?seed=Student'}' alt='User Avatar' class='w-8 h-8 rounded-full border-2 border-blue-400 shadow'>
                                                </div>
                                                <div class='msg-bubble user-msg p-4 rounded-2xl font-medium'>${msg.text}</div>
                                            </div>
                                        `;
                                    } else if (msg.role === 'bot') {
                                        sessionMessagesDiv.innerHTML += `
                                            <div class='flex items-start gap-3 my-2'>
                                                <img src='https://api.dicebear.com/7.x/pixel-art/svg?seed=DaddyMod' alt='Bot Avatar' class='w-10 h-10 rounded-full border-2 border-blue-400 shadow'>

                                                </div>
                                            </div>
                                        `;

                        sessionRow.appendChild(sessionBtn);
                        if (session.timestamp) {
                            const delBtn = document.createElement('button');
                            delBtn.className = 'ml-2 text-pink-500 hover:text-pink-700 opacity-70 group-hover:opacity-100 transition text-lg';

                                            sessionsArr = JSON.parse(localStorage.getItem('konpov_chat_sessions') || '[]');
                                        } catch { sessionsArr = []; }
                                        // Find correct index in original array
                                        const origIdx = sessions.length - 1 - (showAll ? idx : idx);

                                        localStorage.setItem('konpov_chat_sessions', JSON.stringify(sessionsArr));
                                        showKonpovHistoryModal();
                                    }
                                });

                            sessionRow.appendChild(delBtn);

        // --- Session Title Modal ---

                    <input id="session-title-input" type="text" class="w-full border border-slate-300 rounded px-3 py-2 mb-4 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="បញ្ចូលចំណងជើង..." maxlength="60" autocomplete="off" />
                    <div class="flex justify-end gap-2">
                        <button id="session-title-cancel" class="px-4 py-2 rounded bg-slate-200 text-slate-700 font-bold hover:bg-slate-300">បោះបង់</button>
                        <button id="session-title-submit" class="px-4 py-2 rounded bg-blue-600 text-white font-bold hover:bg-blue-700">រក្សាទុក</button>
                    </div>
                </div>
                `;
                document.body.appendChild(modal);
            } else {
                modal.style.display = '';
            }
            const input = modal.querySelector('#session-title-input');
            input.value = '';
            input.focus();
            function close() { modal.style.display = 'none'; }
            modal.querySelector('#session-title-cancel').onclick = function() { close(); if (onCancel) onCancel(); };
            modal.querySelector('#session-title-submit').onclick = function() {

        function newKonpovChat() {
            // Save current chat as a session before clearing
            const currentHistory = getKonpovHistory();
            if (currentHistory && currentHistory.length > 0) {
                let sessions = [];
                try {
                    sessions = JSON.parse(localStorage.getItem('konpov_chat_sessions') || '[]');
                } catch { sessions = []; }
                showSessionTitleModal(function(title) {

                    localStorage.removeItem('konpov_chat_history');

        function pcmToWav(pcmData, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);
            const writeString = (offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
            writeString(0, 'RIFF'); view.setUint32(4, 32 + pcmData.length * 2, true);
            writeString(8, 'WAVE'); writeString(12, 'fmt '); view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeString(36, 'data'); view.setUint32(40, pcmData.length * 2, true);
            let offset = 44;
            for (let i = 0; i < pcmData.length; i++, offset += 2) view.setInt16(offset, pcmData[i], true);
            return new Blob([buffer], { type: 'audio/wav' });
        }

        async function fetchAudioWithLoop(text, buttonElement) {
            let success = false;
            let blob = null;
            buttonElement.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>កំពុងទាញសំឡេង...</span>`;
            
            while (!success) {
                try {
                    const response = await fetch('/api/gemini', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: "Say this as a savage, funny, and energetic young Khmer Gen Z boy. Context: Speaking to a " + (userGender === 'ប្រុស' ? 'male student (bro)' : 'female student (sis)') + ". Use 'daddy' and 'koun'. Voice should be cool and sarcastic. Text: " + text }] }],
                            generationConfig: {
                                responseModalities: ["AUDIO"],
                                speechConfig: {
                                    voiceConfig: { prebuiltVoiceConfig: { voiceName: "Charon" } },
                                    speakingRate: 0.85
                                }
                            },
                            audio: true
                        })
                    });
                    const result = await response.json();
                    const b64Data = result.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                    if (b64Data) {
                        const binStr = atob(b64Data);
                        const bytes = new Uint8Array(binStr.length);
                        for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
                        blob = pcmToWav(new Int16Array(bytes.buffer), 24000);
                        success = true;
                    }
                } catch (e) {
                    console.error("Audio failed, retrying...");
                    await new Promise(r => setTimeout(r, 1000)); 
                }
            }
            return blob;
        }

            // Save bot message to history unless skipSave is true
            if (!skipSave && typeof text === 'string' && text.trim() !== '') {

            // Limit emojis in bot message
            function limitEmojis(str) {
                const emojiRegex = /([\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}\u{1F018}-\u{1F270}\u{238C}-\u{2454}\u{20D0}-\u{20FF}])/gu;
                let emojis = str.match(emojiRegex);
                if (emojis && emojis.length > 3) {
                    let count = 0;
                    str = str.replace(emojiRegex, m => (++count <= 3 ? m : ''));
                }
                return str;

            // --- Persistent audio cache logic ---
            function hashText(str) {
                // Simple hash for text (not cryptographic)
                let hash = 0, i, chr;
                if (str.length === 0) return hash;
                for (i = 0; i < str.length; i++) {
                    chr = str.charCodeAt(i);
                    hash = ((hash << 5) - hash) + chr;
                    hash |= 0;
                }
                return hash;
            }
            const hash = hashText(text);
            const audioKey = 'konpov_audio_' + hash;

            };
            playBtn.innerHTML = statusMap[lastStatus] || statusMap['ready'];
            // --- Only one bot audio can play at a time ---
            if (!window._konpovAudioState) {
                window._konpovAudioState = { currentBtn: null };
            }
            // If this is a history message (autoPlay === false), only use cache, never fetch
            // Only autoPlay for introMsg, not for subsequent bot messages
            if (window._konpovAfterIntro && text !== introMsg) autoPlay = false;
            if (cachedAudio || autoPlay === false) {
                if (cachedAudio) {
                    // Use cached audio
                    const byteCharacters = atob(cachedAudio);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) {
                        byteNumbers[i] = byteCharacters.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray], { type: 'audio/wav' });
                    const url = URL.createObjectURL(blob);
                    let isPlaying = lastStatus === 'playing';
                    const playLogic = () => {

                        if (window._konpovAudioState.currentBtn && window._konpovAudioState.currentBtn !== playBtn) {

                            if (window._konpovAudioState.currentBtn && window._konpovAudioState.currentBtn !== playBtn) {

                            audioPlayer.src = url;
                            audioPlayer.play().then(() => {
                                playBtn.innerHTML = statusMap['playing'];
                                setVoiceStatus(hash, 'playing');
                                isPlaying = true;
                            }).catch(() => {
                                playBtn.innerHTML = statusMap['ready'];
                                setVoiceStatus(hash, 'ready');
                            });
                        };
                        playBtn.onclick = () => {
                            if (!isPlaying) {
                                playLogic();

                                audioPlayer.pause();
                                playBtn.innerHTML = statusMap['paused'];
                                setVoiceStatus(hash, 'paused');
                                isPlaying = false;

                            setVoiceStatus(hash, 'ended');

                            window._konpovAudioState.currentBtn = null;
