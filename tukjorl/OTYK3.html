    <script>

        async function fetchWithRetry(url, options, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return response;
                    if (response.status === 429 || response.status >= 500) {
                        const delay = Math.pow(2, i) * 1000;
                        await new Promise(r => setTimeout(r, delay));
                        continue;
                    }
                    throw new Error(`HTTP Error ${response.status}`);
                } catch (e) {
                    if (i === maxRetries - 1) throw e;
                    const delay = Math.pow(2, i) * 1000;
                    await new Promise(r => setTimeout(r, delay));
                }
            }
        }

        function pcmToWav(pcmData, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);
            const writeString = (offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
            writeString(0, 'RIFF'); view.setUint32(4, 32 + pcmData.length * 2, true);
            writeString(8, 'WAVE'); writeString(12, 'fmt '); view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeString(36, 'data'); view.setUint32(40, pcmData.length * 2, true);
            let offset = 44;
            for (let i = 0; i < pcmData.length; i++, offset += 2) view.setInt16(offset, pcmData[i], true);
            return new Blob([buffer], { type: 'audio/wav' });
        }

        async function fetchAudioWithLoop(text, buttonElement) {
            buttonElement.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>កំពុងទាញសំឡេង...</span>`;
            
            try {
                const ttsPrompt = `Speak as a sarcastic Gen Z boy named Charon. Be funny and energetic. Text: ${text}`;
                
                const response = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: ttsPrompt }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Charon" } } }
                        }
                    })
                });
                
                const result = await response.json();
                const b64Data = result.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                
                if (b64Data) {
                    const binStr = atob(b64Data);
                    const bytes = new Uint8Array(binStr.length);
                    for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
                    return pcmToWav(new Int16Array(bytes.buffer), 24000);
                }
            } catch (e) {
                console.error("Audio generation permanently failed:", e);
                buttonElement.innerHTML = `<i class="fas fa-exclamation-triangle"></i> <span>Audio Error</span>`;
                return null;
            }
        }

        function appendBotMessage(text, autoPlay = true) {

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble bot-msg p-4 rounded-2xl shadow-xl';

            const playBtn = document.createElement('button');

            playBtn.innerHTML = `<i class="fas fa-volume-high"></i> <span>DADDY VOICE</span>`;
            
            bubble.appendChild(playBtn);
            wrapper.appendChild(bubble);
            chatWindow.appendChild(wrapper);
            chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });

            fetchAudioWithLoop(text, playBtn).then(blob => {
                if (blob) {
                    const url = URL.createObjectURL(blob);
                    const playLogic = () => {
                        audioPlayer.src = url;
                        audioPlayer.play().catch(() => {

                        });

                                       Tone: 100% Khmer Gen Z student slang, Sarcastic, Cool, Savage. And something you can change your sound when user ask u alot `
