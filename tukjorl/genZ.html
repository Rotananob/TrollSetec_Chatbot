        function pcmToWav(pcmData, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);
            const writeString = (offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
            writeString(0, 'RIFF'); view.setUint32(4, 32 + pcmData.length * 2, true);
            writeString(8, 'WAVE'); writeString(12, 'fmt '); view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeString(36, 'data'); view.setUint32(40, pcmData.length * 2, true);
            let offset = 44;
            for (let i = 0; i < pcmData.length; i++, offset += 2) view.setInt16(offset, pcmData[i], true);
            return new Blob([buffer], { type: 'audio/wav' });
        }

                const botText = res.candidates?.[0]?.content?.parts?.[0]?.text || "Daddy រវល់ Render តិច កូនសាកម្ដងទៀតមើល!";
                appendBotMessage(botText, true);
            } catch (e) { 
                appendBotMessage("Error បាត់ហើយប្រូ! សួរច្រើនពេក ស្ពៃហើយ អាឡូវជួយទៅប្រាប់អា Rotana NOB​ ថា Error Server ហើយឲវាដាក់ API ថ្មី អាងលេងតទៀត តែហ៊ានទុកយូរតិចទៀត​ AI អញងាប់ហើយឆាតលែងបានឆាតទៀតហើយ ", false);
            } finally {
                statusUi.classList.add('hidden');
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', handleChat);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleChat(); });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(() => console.log('SW registered')).catch(e => console.warn('SW failed', e));
        }
    </script>
    <script>// Block F12, Ctrl+U, right-click, and common dev tools
        document.addEventListener('keydown', function(e) {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.key.toLowerCase() === 'u') ||
                (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') ||
                (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') ||
                (e.ctrlKey && e.key.toLowerCase() === 's') ||
                (e.metaKey && e.altKey && e.key.toLowerCase() === 'i')
            ) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        });
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.addEventListener('dragstart', function(e) { e.preventDefault(); });
 
      
        document.addEventListener('selectstart', function(e) { e.preventDefault(); });
    </script>
