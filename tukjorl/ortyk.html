    <script>
        const apiKey = "AIzaSyDS8qd8ugKCEeVAEnP2ADBGO-tVFy2QfTs"; 
        const chatWindow = document.getElementById('chat-window');

        const sendBtn = document.getElementById('send-btn');
        const statusUi = document.getElementById('status-ui');
        const audioPlayer = document.getElementById('audio-player');

        function pcmToWav(pcmData, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);
            const writeString = (offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
            writeString(0, 'RIFF'); view.setUint32(4, 32 + pcmData.length * 2, true);
            writeString(8, 'WAVE'); writeString(12, 'fmt '); view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeString(36, 'data'); view.setUint32(40, pcmData.length * 2, true);
            let offset = 44;
            for (let i = 0; i < pcmData.length; i++, offset += 2) view.setInt16(offset, pcmData[i], true);
            return new Blob([buffer], { type: 'audio/wav' });
        }

        async function fetchAudioWithLoop(text, buttonElement) {
            let success = false;
            let blob = null;
            
            buttonElement.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>កំពុងទាញសំឡេង...</span>`;
            
            while (!success) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: "Say this as a savage, funny, and energetic young Khmer Gen Z boy. Call the listener 'koun', 'bro', 'sis', or 'daddy'. Voice should be cool and sarcastic. Text: " + text }] }],
                            generationConfig: {
                                responseModalities: ["AUDIO"],
                                speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Charon" } } }
                            }
                        })
                    });
                    const result = await response.json();
                    const b64Data = result.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                    
                    if (b64Data) {
                        const binStr = atob(b64Data);
                        const bytes = new Uint8Array(binStr.length);
                        for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
                        blob = pcmToWav(new Int16Array(bytes.buffer), 24000);
                        success = true;
                    }
                } catch (e) {
                    console.error("Audio failed, retrying...");
                    await new Promise(r => setTimeout(r, 1000)); 
                }
            }
            return blob;
        }

        function appendBotMessage(text, autoPlay = true) {
            const wrapper = document.createElement('div');
            wrapper.className = 'flex justify-start';
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble bot-msg p-4 rounded-2xl shadow-xl';
            bubble.innerHTML = `<p class="text-slate-200 text-sm font-medium leading-relaxed">${text}</p>`;

            const playBtn = document.createElement('button');
            playBtn.className = "mt-3 bg-blue-500/10 text-blue-400 px-3 py-1.5 rounded-lg text-[10px] font-black border border-blue-500/20 flex items-center gap-2 transition hover:bg-blue-500/20";
            playBtn.innerHTML = `<i class="fas fa-volume-high"></i> <span>DADDY VOICE</span>`;
            
            bubble.appendChild(playBtn);
            wrapper.appendChild(bubble);
            chatWindow.appendChild(wrapper);
            chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });

            fetchAudioWithLoop(text, playBtn).then(blob => {
                if (blob) {
                    const url = URL.createObjectURL(blob);
                    const playLogic = () => {
                        audioPlayer.src = url;
                        audioPlayer.play().catch(() => {
                            playBtn.innerHTML = `<i class="fas fa-play"></i> <span>ចុចស្តាប់ Daddy បាញ់</span>`;
                        });
                        playBtn.innerHTML = `<i class="fas fa-headset animate-pulse text-blue-400"></i> <span>កំពុងបាញ់...</span>`;
                        audioPlayer.onended = () => { playBtn.innerHTML = `<i class="fas fa-play"></i> <span>ស្តាប់ម្ដងទៀត</span>`; };
                    };
                    playBtn.onclick = playLogic;
                    if (autoPlay) playLogic();
                }
            });
        }

        async function handleChat() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            const uW = document.createElement('div');
            uW.className = 'flex justify-end';
            uW.innerHTML = `<div class="msg-bubble user-msg p-4 rounded-2xl font-medium shadow-lg text-sm">${prompt}</div>`;
            chatWindow.appendChild(uW);
            userInput.value = '';
            statusUi.classList.remove('hidden');
            sendBtn.disabled = true;
            chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { 
                            parts: [{ 
                                text: `Identity: You are the Savage Gen Z Male Moderator of the SETEC University Community. 
                                       Vocab: Use "ប្រូ", "សុីស", "Daddy", "កូន", "កូនសម្លាញ់", "អេភី (AP)", "Bro", "Slay". 
                                       Tone: 100% Khmer Gen Z student slang, Sarcastic, Cool, Savage.
                                       Specific Scenarios:
                                       1. Senior Scams: Troll seniors who trick freshies into doing their group work or assignments. "សិស្សច្បងបោកឱ្យធ្វើការងារក្រុមឱ្យ ហ្នឹង Idol ហ្មង", "កូនអើយ គេឱ្យឯងធ្វើ Group work ហ្នឹង គេទុកឯងជាម៉ូយទេ"។
                                       2. Freshie Overload: Troll SETEC for having too many new students (ជាន់គ្នាងាប់)។
                                       3. Relationship: Friendzone, being used as transport (កង់បីស្នេហ៍), and ghosting.
                                       4. Exams: Retakes (ប្រឡងសង) and teachers giving hard assignments.
                                       Always respond like a cool senior who trolls his juniors for fun. Stay energy-packed!` 
                            }] 
                        }
                    })
                });

                const res = await response.json();
                const botText = res.candidates?.[0]?.content?.parts?.[0]?.text || "Daddy រវល់ Render តិច កូនសាកម្ដងទៀតមើល!";
                appendBotMessage(botText, true);
            } catch (e) { 
                appendBotMessage("Error បាត់ហើយប្រូ! សង្ស័យសិស្សច្បងលួច Password ហើយ! 🤣", false);
            } finally {
                statusUi.classList.add('hidden');
                sendBtn.disabled = false;
            }
        }

        window.onload = () => {
            appendBotMessage("សួស្តីកូនសម្លាញ់! Daddy មកហើយ! ចង់សួររឿងរៀន រឿងសិស្សច្បងបោកឱ្យធ្វើ Assignment ឬរឿងសិស្សថ្មីចូលមកជាន់គ្នាងាប់នៅសុីតិច? សួរមក Daddy បាញ់ឱ្យចុក! 🤣🔥", false);
        };

        sendBtn.addEventListener('click', handleChat);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleChat(); });
    </script>
